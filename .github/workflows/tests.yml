name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# uv takes a runner's system Python over its managed builds unless told otherwise; the image
# runs uv's managed CPython and its bundled SQLite (D2, D15), so every job does too
env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  # the Python suite on the production interpreter (spec D11); the native-extension job
  # and the non-blocking 3.14t job are added next to this one by their own plans
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"  # same pin as ARG UV_VERSION in the Dockerfile
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --frozen --group bench
      - run: uv run --no-sync pytest -q

  # raggio_native (native/, ADR 0004) built from source on x86_64 and on aarch64 (the
  # DGX), then the same suite with REQUIRE_NATIVE=1: the parity tests run against the
  # extension, and a missing one fails the job instead of skipping them
  native:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"  # same pin as ARG UV_VERSION in the Dockerfile
          python-version: "3.12"
      - name: Install Rust (same pin as ARG RUST_VERSION in the Dockerfile)
        run: |
          if ! command -v rustup; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Build raggio-native
        run: uv sync --frozen --group bench --extra native
      - name: Test with the extension required
        run: uv run --no-sync pytest -q
        env:
          REQUIRE_NATIVE: "1"
