name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the Python suite on the production interpreter (spec D11); the native-extension job
  # and the non-blocking 3.14t job are added next to this one by their own plans
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"  # same pin as ARG UV_VERSION in the Dockerfile
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --frozen --group bench
      - run: uv run --no-sync pytest -q
