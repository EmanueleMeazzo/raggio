[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "raggio-native"
version = "0.1.0"
requires-python = ">=3.12"

[tool.maturin]
module-name = "raggio_native"
locked = true
strip = true

[tool.uv]
# replaces uv's default cache keys: any of these changing rebuilds the extension
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "build.rs" },
    { file = "gen_unicode.py" },
    { file = "src/**/*.rs" },
]
