[project]
name = "raggio"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "turbovec>=1.0.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
# bench/ harness only (bench.py, floor_probe.py, prep_arxiv.py): no free-threaded
# wheel exists, so it stays out of the default sync (ADR 0001:31 keeps runtime JSON on stdlib)
bench = [
    "orjson>=3.12.0",
]
docs = [
    "mkdocs-material>=9",
]

[tool.uv]
# floor for every uv that touches uv.lock; the exact pin lives in the Dockerfile
# (ARG UV_VERSION) and .github/workflows/tests.yml (setup-uv version)
required-version = ">=0.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raggio"]
