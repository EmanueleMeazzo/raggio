[project]
name = "raggio"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "turbovec>=1.0.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "orjson>=3.12.0",
    "pytest>=8",
]
docs = [
    "mkdocs-material>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raggio"]
